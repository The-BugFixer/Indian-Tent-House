<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="60%" stop-color="#2a0a10" />
      <stop offset="100%" stop-color="#120406" />
    </linearGradient>
    <linearGradient id="goldStage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a691e" />
      <stop offset="50%" stop-color="#ffd56b" />
      <stop offset="100%" stop-color="#7a5a14" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g4Bg)" />

  <!-- Carved Jali Floral Backdrop Panel Frame -->
  <rect x="140" y="80" width="520" height="380" rx="12" fill="#20070c" stroke="url(#goldStage)" stroke-width="3" />
  <rect x="160" y="100" width="480" height="340" rx="8" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Tri-Arch Backdrop Structure -->
  <path d="M 180 440 L 180 240 Q 250 140 320 240 L 320 440 Z" fill="#320c15" stroke="url(#goldStage)" stroke-width="2" />
  <path d="M 330 440 L 330 200 Q 400 90 470 200 L 470 440 Z" fill="#440f1c" stroke="url(#goldStage)" stroke-width="2.5" />
  <path d="M 480 440 L 480 240 Q 550 140 620 240 L 620 440 Z" fill="#320c15" stroke="url(#goldStage)" stroke-width="2" />

  <!-- Royal Sofas / Chairs Silhouette On Stage -->
  <rect x="350" y="340" width="100" height="50" rx="8" fill="url(#goldStage)" />
  <rect x="360" y="310" width="80" height="40" rx="12" fill="#8a1724" stroke="url(#goldStage)" stroke-width="2" />

  <!-- Elevated Multi-Step Stage Deck -->
  <polygon points="80,560 720,560 760,600 40,600" fill="#180407" stroke="url(#goldStage)" stroke-width="1.5" />
  <rect x="110" y="470" width="580" height="90" rx="4" fill="#28080f" stroke="url(#goldStage)" stroke-width="2" />
  <!-- Stage Carpet Runner -->
  <rect x="260" y="470" width="280" height="90" fill="#8a1724" />

  <!-- Floral Garland Drops -->
  <g stroke="#ffb703" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 6">
    <line x1="200" y1="120" x2="200" y2="280" />
    <line x1="240" y1="120" x2="240" y2="310" />
    <line x1="400" y1="100" x2="400" y2="220" stroke="#fb8500" stroke-width="7" />
    <line x1="560" y1="120" x2="560" y2="310" />
    <line x1="600" y1="120" x2="600" y2="280" />
  </g>

  <!-- Warm Footlight Glow on Base -->
  <ellipse cx="400" cy="540" rx="280" ry="25" fill="#fbd38d" opacity="0.15" />

  <!-- Badge -->
  <rect x="30" y="30" width="240" height="34" rx="17" fill="rgba(20, 6, 8, 0.85)" stroke="#ffd56b" stroke-width="1.2" />
  <text x="150" y="52" fill="#ffeaa7" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">GRAND STAGE SETUP</text>
</svg>
