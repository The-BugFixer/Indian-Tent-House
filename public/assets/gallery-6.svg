<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="g6Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="banquetDrape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g6Bg)" />

  <!-- Multi-Bay Dining Canopy Ceiling with Ivory Liners -->
  <g stroke="#94a3b8" stroke-width="2" opacity="0.6">
    <path d="M 50 140 Q 250 80 400 140 Q 550 80 750 140" fill="none" stroke="url(#goldTrim)" stroke-width="3" />
    <path d="M 50 200 Q 250 140 400 200 Q 550 140 750 200" fill="none" />
  </g>
  <!-- Ribs -->
  <line x1="250" y1="110" x2="250" y2="520" stroke="#475569" stroke-width="12" stroke-linecap="round" />
  <line x1="550" y1="110" x2="550" y2="520" stroke="#475569" stroke-width="12" stroke-linecap="round" />

  <!-- Warm Pendant Lamps Above Dining Sections -->
  <g fill="#fef08a">
    <line x1="160" y1="140" x2="160" y2="280" stroke="#64748b" stroke-width="1.5" />
    <path d="M 140 280 L 180 280 L 170 300 L 150 300 Z" fill="url(#goldTrim)" />
    <circle cx="160" cy="305" r="8" fill="#fef08a" />

    <line x1="400" y1="170" x2="400" y2="290" stroke="#64748b" stroke-width="1.5" />
    <path d="M 380 290 L 420 290 L 410 310 L 390 310 Z" fill="url(#goldTrim)" />
    <circle cx="400" cy="315" r="10" fill="#fef08a" />

    <line x1="640" y1="140" x2="640" y2="280" stroke="#64748b" stroke-width="1.5" />
    <path d="M 620 280 L 660 280 L 650 300 L 630 300 Z" fill="url(#goldTrim)" />
    <circle cx="640" cy="305" r="8" fill="#fef08a" />
  </g>

  <!-- Round Banquet Tables with Linen & Centerpieces -->
  <!-- Left Table -->
  <ellipse cx="180" cy="460" rx="90" ry="35" fill="#f8fafc" stroke="url(#goldTrim)" stroke-width="2" />
  <ellipse cx="180" cy="445" rx="20" ry="8" fill="#b91c1c" />
  <!-- Center Table -->
  <ellipse cx="400" cy="490" rx="120" ry="46" fill="#f8fafc" stroke="url(#goldTrim)" stroke-width="2.5" />
  <ellipse cx="400" cy="470" rx="26" ry="10" fill="#d97706" />
  <!-- Right Table -->
  <ellipse cx="620" cy="460" rx="90" ry="35" fill="#f8fafc" stroke="url(#goldTrim)" stroke-width="2" />
  <ellipse cx="620" cy="445" rx="20" ry="8" fill="#b91c1c" />

  <!-- Buffet Counter Canopy in Background -->
  <rect x="220" y="340" width="360" height="40" rx="4" fill="#0f172a" stroke="url(#goldTrim)" stroke-width="1.5" />
  <g fill="#fef08a" opacity="0.9">
    <ellipse cx="280" cy="345" rx="14" ry="5" />
    <ellipse cx="340" cy="345" rx="14" ry="5" />
    <ellipse cx="400" cy="345" rx="14" ry="5" />
    <ellipse cx="460" cy="345" rx="14" ry="5" />
    <ellipse cx="520" cy="345" rx="14" ry="5" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="250" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="155" y="52" fill="#f8fafc" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">BANQUET & DINING MARQUEE</text>
</svg>
