<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0818" />
      <stop offset="60%" stop-color="#24103a" />
      <stop offset="100%" stop-color="#12071f" />
    </linearGradient>
    <radialGradient id="partyGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0a0818" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g3Bg)" />
  <rect width="800" height="600" fill="url(#partyGlow)" />

  <!-- Cascading Canopy of Fairy Lights -->
  <g stroke="#fef08a" stroke-width="1.2" opacity="0.75">
    <path d="M 50 140 Q 400 240 750 140" fill="none" stroke-dasharray="3 6" />
    <path d="M 50 180 Q 400 300 750 180" fill="none" stroke-dasharray="4 8" />
    <path d="M 50 220 Q 400 350 750 220" fill="none" stroke-dasharray="5 7" />
    <path d="M 80 100 Q 400 200 720 100" fill="none" stroke-dasharray="3 5" />
  </g>

  <!-- Glowing Hanging Edison Bulbs & Lanterns -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="160" y1="140" x2="160" y2="240" />
    <circle cx="160" cy="246" r="8" fill="#fde047" stroke="none" />

    <line x1="280" y1="190" x2="280" y2="310" />
    <circle cx="280" cy="316" r="10" fill="#fb923c" stroke="none" />

    <line x1="400" y1="210" x2="400" y2="340" />
    <circle cx="400" cy="348" r="12" fill="#fde047" stroke="none" />

    <line x1="520" y1="190" x2="520" y2="300" />
    <circle cx="520" cy="306" r="9" fill="#f43f5e" stroke="none" />

    <line x1="640" y1="140" x2="640" y2="250" />
    <circle cx="640" cy="256" r="8" fill="#fde047" stroke="none" />
  </g>

  <!-- Circular Dance Floor & DJ Stage Lighting -->
  <ellipse cx="400" cy="490" rx="260" ry="65" fill="#1b1129" stroke="#d946ef" stroke-width="2.5" />
  <ellipse cx="400" cy="490" rx="180" ry="42" fill="#2d1544" stroke="#e879f9" stroke-width="1.8" />
  <!-- Moving Head Beam Lights -->
  <polygon points="400,200 220,490 290,510" fill="rgba(217, 70, 239, 0.18)" />
  <polygon points="400,200 580,490 510,510" fill="rgba(56, 189, 248, 0.18)" />

  <!-- Badge -->
  <rect x="30" y="30" width="230" height="34" rx="17" fill="rgba(10, 8, 24, 0.85)" stroke="#c084fc" stroke-width="1.2" />
  <text x="145" y="52" fill="#e9d5ff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">SANGEET & COCKTAIL</text>
</svg>
