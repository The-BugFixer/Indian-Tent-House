<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0a0f" />
      <stop offset="40%" stop-color="#361018" />
      <stop offset="85%" stop-color="#1a060a" />
      <stop offset="100%" stop-color="#0e0305" />
    </linearGradient>
    <radialGradient id="pGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fbd38d" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#b83227" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#140407" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a691e" />
      <stop offset="35%" stop-color="#ffd56b" />
      <stop offset="70%" stop-color="#e2ba4f" />
      <stop offset="100%" stop-color="#7a5a14" />
    </linearGradient>
    <linearGradient id="maroonVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a1c29" />
      <stop offset="60%" stop-color="#540e17" />
      <stop offset="100%" stop-color="#2a050b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" rx="16" fill="url(#pBg)" />
  <rect width="600" height="800" rx="16" fill="url(#pGlow)" />

  <!-- Decorative Outer Frame Border -->
  <rect x="24" y="24" width="552" height="752" rx="12" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.4" />
  <rect x="34" y="34" width="532" height="732" rx="8" fill="none" stroke="#fbd38d" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.3" />

  <!-- Corner Ornamental Motifs -->
  <g fill="#d4af37" opacity="0.7">
    <circle cx="24" cy="24" r="5" />
    <circle cx="576" cy="24" r="5" />
    <circle cx="24" cy="776" r="5" />
    <circle cx="576" cy="776" r="5" />
  </g>

  <!-- Grand Drapes Cascade (Left & Right) -->
  <path d="M 60 40 Q 180 180 120 480 Q 80 620 50 720 L 50 40 Z" fill="url(#maroonVelvet)" opacity="0.9" />
  <path d="M 540 40 Q 420 180 480 480 Q 520 620 550 720 L 550 40 Z" fill="url(#maroonVelvet)" opacity="0.9" />

  <!-- Royal Floral & Golden Arch Canopy -->
  <!-- Upper Scalloped Canopy Roof -->
  <path d="M 120 300 Q 300 120 480 300 L 450 340 Q 300 200 150 340 Z" fill="url(#goldPillar)" />
  <path d="M 150 340 Q 300 220 450 340 L 430 370 Q 300 270 170 370 Z" fill="#8f212d" />

  <!-- Carved Royal Arch Pillars -->
  <!-- Left Pillar -->
  <rect x="130" y="340" width="40" height="380" rx="4" fill="url(#goldPillar)" />
  <line x1="150" y1="340" x2="150" y2="720" stroke="#fff1c5" stroke-width="2" opacity="0.6" />
  <rect x="118" y="330" width="64" height="20" rx="3" fill="#ffe082" />
  <rect x="118" y="700" width="64" height="30" rx="3" fill="#8a691e" />

  <!-- Right Pillar -->
  <rect x="430" y="340" width="40" height="380" rx="4" fill="url(#goldPillar)" />
  <line x1="450" y1="340" x2="450" y2="720" stroke="#fff1c5" stroke-width="2" opacity="0.6" />
  <rect x="418" y="330" width="64" height="20" rx="3" fill="#ffe082" />
  <rect x="418" y="700" width="64" height="30" rx="3" fill="#8a691e" />

  <!-- Mandap Platform Stage Base -->
  <path d="M 90 710 L 510 710 L 540 760 L 60 760 Z" fill="#2d0a11" stroke="#d4af37" stroke-width="2" />
  <rect x="100" y="714" width="400" height="6" fill="#ffd56b" opacity="0.8" />

  <!-- Center Floating Chandelier -->
  <line x1="300" y1="180" x2="300" y2="290" stroke="#d4af37" stroke-width="2.5" />
  <circle cx="300" cy="295" r="16" fill="#ffe89e" />
  <circle cx="300" cy="295" r="26" fill="#ffe89e" opacity="0.3" />
  <path d="M 270 295 Q 300 330 330 295" fill="none" stroke="#d4af37" stroke-width="3" />
  <!-- Chandelier Crystals -->
  <circle cx="280" cy="315" r="3.5" fill="#fff" />
  <circle cx="300" cy="325" r="4.5" fill="#fff" />
  <circle cx="320" cy="315" r="3.5" fill="#fff" />

  <!-- Traditional Marigold & Rose Floral Garlands Droplets -->
  <g opacity="0.9">
    <!-- Garlands swags -->
    <path d="M 160 360 Q 300 440 440 360" fill="none" stroke="#ff9f1c" stroke-width="7" stroke-dasharray="6 4" stroke-linecap="round" />
    <path d="M 170 380 Q 300 470 430 380" fill="none" stroke="#e71d36" stroke-width="6" stroke-dasharray="5 5" stroke-linecap="round" />
    <path d="M 190 410 Q 300 490 410 410" fill="none" stroke="#ffe082" stroke-width="5" stroke-dasharray="4 6" stroke-linecap="round" />
  </g>

  <!-- Warm Diya / Floor Candle Lanterns -->
  <g fill="#ffe082">
    <ellipse cx="200" cy="710" rx="8" ry="4" fill="#d4af37" />
    <circle cx="200" cy="703" r="5" fill="#ffb703" />
    <circle cx="200" cy="701" r="3" fill="#fff" />

    <ellipse cx="400" cy="710" rx="8" ry="4" fill="#d4af37" />
    <circle cx="400" cy="703" r="5" fill="#ffb703" />
    <circle cx="400" cy="701" r="3" fill="#fff" />
  </g>

  <!-- Text Badge at Base of Illustration -->
  <g transform="translate(300, 620)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#150508" stroke="#d4af37" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="700" fill="#ffd978" letter-spacing="3" text-anchor="middle">ROYAL WEDDING MANDAP</text>
  </g>
</svg>
